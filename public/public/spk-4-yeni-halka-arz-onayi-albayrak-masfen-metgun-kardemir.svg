<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">SPK'dan 4 Yeni Halka Arz Onayı</title>
  <desc id="desc">Albayrak Hazır Beton, Masfen Enerji, Metgün Enerji ve Kardemir Çelik halka arz fiyatı ve lot bilgileri</desc>
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071b37"/>
      <stop offset="1" stop-color="#0d3764"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b91c1c"/>
      <stop offset="1" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="675" fill="url(#navy)" opacity="0.04"/>
  <circle cx="1040" cy="92" r="210" fill="#e2e8f0" opacity="0.45"/>
  <circle cx="116" cy="588" r="250" fill="#dbeafe" opacity="0.35"/>

  <g transform="translate(54 34)">
    <rect x="0" y="0" width="250" height="38" rx="6" fill="url(#red)"/>
    <text x="18" y="26" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#fff">SPK ONAYLI IZAHNAME</text>
  </g>

  <g transform="translate(54 132)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#071b37">SPK'dan 4 Yeni</text>
    <text x="0" y="72" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" fill="#071b37">Halka Arz Onayi</text>
    <rect x="0" y="108" width="452" height="4" rx="2" fill="#ef4444"/>
    <text x="0" y="156" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#334155">Albayrak Hazir Beton, Masfen Enerji,</text>
    <text x="0" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="600" fill="#334155">Metgun Enerji ve Kardemir Celik icin SPK onayi</text>
  </g>

  <g transform="translate(610 74)" filter="url(#shadow)">
    <rect x="0" y="0" width="536" height="386" rx="18" fill="#ffffff"/>
    <rect x="0" y="0" width="536" height="58" rx="18" fill="#071b37"/>
    <text x="26" y="38" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#fff">Halka Arz Ozeti</text>
    <text x="270" y="37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">Fiyat</text>
    <text x="408" y="37" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#cbd5e1">Toplam Lot</text>

    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(0 58)">
        <rect x="0" y="0" width="536" height="82" fill="#fff"/>
        <rect x="22" y="22" width="6" height="38" rx="3" fill="#ef4444"/>
        <text x="44" y="35" font-size="21" font-weight="800" fill="#0f172a">Albayrak Hazir Beton</text>
        <text x="44" y="61" font-size="14" font-weight="700" fill="#64748b">Hazir beton ve insaat</text>
        <text x="270" y="43" font-size="25" font-weight="900" fill="#071b37">38,60 TL</text>
        <text x="408" y="43" font-size="25" font-weight="900" fill="#071b37">70 Mn</text>
      </g>
      <line x1="22" y1="140" x2="514" y2="140" stroke="#e2e8f0"/>

      <g transform="translate(0 140)">
        <rect x="0" y="0" width="536" height="82" fill="#fff"/>
        <rect x="22" y="22" width="6" height="38" rx="3" fill="#ef4444"/>
        <text x="44" y="35" font-size="21" font-weight="800" fill="#0f172a">Masfen Enerji</text>
        <text x="44" y="61" font-size="14" font-weight="700" fill="#64748b">Yenilenebilir enerji</text>
        <text x="270" y="43" font-size="25" font-weight="900" fill="#071b37">45,68 TL</text>
        <text x="408" y="43" font-size="25" font-weight="900" fill="#071b37">85 Mn</text>
      </g>
      <line x1="22" y1="222" x2="514" y2="222" stroke="#e2e8f0"/>

      <g transform="translate(0 222)">
        <rect x="0" y="0" width="536" height="82" fill="#fff"/>
        <rect x="22" y="22" width="6" height="38" rx="3" fill="#ef4444"/>
        <text x="44" y="35" font-size="21" font-weight="800" fill="#0f172a">Metgun Enerji</text>
        <text x="44" y="61" font-size="14" font-weight="700" fill="#64748b">RES, GES ve enerji yatirimlari</text>
        <text x="270" y="43" font-size="25" font-weight="900" fill="#071b37">20,00 TL</text>
        <text x="408" y="43" font-size="25" font-weight="900" fill="#071b37">135,6 Mn</text>
      </g>
      <line x1="22" y1="304" x2="514" y2="304" stroke="#e2e8f0"/>

      <g transform="translate(0 304)">
        <rect x="0" y="0" width="536" height="82" rx="18" fill="#fff"/>
        <rect x="22" y="22" width="6" height="38" rx="3" fill="#ef4444"/>
        <text x="44" y="35" font-size="21" font-weight="800" fill="#0f172a">Kardemir Celik</text>
        <text x="44" y="61" font-size="14" font-weight="700" fill="#64748b">Celik sanayi</text>
        <text x="270" y="43" font-size="25" font-weight="900" fill="#071b37">35,00 TL</text>
        <text x="408" y="43" font-size="25" font-weight="900" fill="#071b37">128 Mn</text>
      </g>
    </g>
  </g>

  <g transform="translate(54 415)">
    <rect x="0" y="0" width="502" height="152" rx="18" fill="#ffffff" filter="url(#shadow)"/>
    <text x="28" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#071b37">Halka arz fonu nerede kullanilacak?</text>
    <text x="28" y="78" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155">Enerji yatirimlari, hammadde ve isletme sermayesi,</text>
    <text x="28" y="107" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#334155">insaat projeleri, ekipman alimi ve borc azaltimi</text>
  </g>

  <g transform="translate(54 600)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#64748b">Hoca ile Borsa • Halka arz haberleri</text>
  </g>
</svg>
